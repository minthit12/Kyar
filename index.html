
<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မြန်မာ့ရိုးရာ ကျားထိုးဂိမ်း (Online Multiplayer)</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #1a252f; color: white; text-align: center; margin: 0; padding: 5px; user-select: none; }
        h2 { margin: 5px 0; font-size: 16px; }
        
        /* Lobby UI Panel */
        .lobby-panel { background: #2c3e50; padding: 6px 10px; border-radius: 6px; max-width: 340px; margin: 4px auto; border: 1px solid #34495e; font-size: 12px; }
        .lobby-panel h3 { margin: 0 0 4px 0; font-size: 13px; display: inline-block; }
        .lobby-btn { background: #2980b9; color: white; border: none; padding: 6px 12px; margin: 2px; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .lobby-btn:hover { background: #3498db; }
        .lobby-input { padding: 5px; font-size: 12px; border-radius: 4px; border: 1px solid #ccc; width: 90px; text-align: center; color: black; }
        
        /* Status & Timer UI */
        .status-container { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 8px; }
        .status-box { background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 4px; display: inline-block; font-weight: bold; font-size: 13px; border: 1px solid #34495e; }
        .timer-box { font-size: 14px; font-weight: bold; background: #27ae60; padding: 4px 10px; border-radius: 4px; border: 1px solid #2ecc71; display: none; }
        .timer-urgent { background: #c0392b !important; border-color: #e74c3c !important; animation: blink 1s infinite; }
        
        @keyframes blink { 50% { opacity: 0.6; } }

        .board-container { width: 100%; max-width: 360px; margin: auto; }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border: 4px solid #2c3e50; background: #fbeee0; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .square { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .light { background: #fbeee0; } 
        .dark { background: #b58863; }  
        .piece { width: 80%; height: 80%; border-radius: 50%; box-shadow: inset 0 0 6px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.5); position: relative; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
        .red-piece { background: #d35400; border: 2px solid #ba4a00; }
        .black-piece { background: #2c3e50; border: 2px solid #1a252f; }
        .selected { transform: scale(1.05); border: 2px solid #f1c40f !important; box-shadow: 0 0 8px #f1c40f; }
        .suggested::after { content: ''; width: 30%; height: 30%; background: #2ecc71; border-radius: 50%; position: absolute; box-shadow: 0 0 4px #000; }
        .btn-restart { background: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 80%; max-width: 300px; }
        .btn-restart:hover { background: #219a52; }
    </style>
</head>
<body>

    <h2>🎮 မြန်မာ့ရိုးရာ ကျားထိုးဂိမ်း (Online)</h2>
    
    <div class="lobby-panel" id="lobbyPanel">
        <h3>🌐 အွန်လိုင်းခန်းမ - </h3>
        <button class="lobby-btn" onclick="hostRoom()">🏠 Room ဆောက်မည်</button>
        <input type="text" id="roomInput" class="lobby-input" placeholder="Room ID ထည့်ပါ">
        <button class="lobby-btn" style="background:#e67e22;" onclick="joinRoom()">🚪 ဝင်ဆော့မည်</button>
    </div>

    <div class="status-container">
        <div class="status-box" id="statusText">ကျေးဇူးပြု၍ Room ဆောက်ပါ သို့မဟုတ် ဝင်ဆော့ပါ</div>
        <div class="timer-box" id="timerDisplay">⏱ ကျန်ရှိချိန် - 15 စက္ကန့်</div>
    </div>

    <div class="board-container">
        <div class="board" id="gameBoard"></div>
    </div>

    <button class="btn-restart" id="restartBtn" onclick="resetOnlineGame()" style="display:none;">🔄 ပွဲသစ်ပြန်စမည်</button>

<script>
    // Firebase Setup
    const firebaseConfig = {
        databaseURL: "https://myhomelist-6550a-default-rtdb.firebaseio.com/" 
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Web Audio API စနစ်အသစ် (ကျယ်ကျယ်လောင်လောင်နှင့် ပီပီသပ်သပ် မြည်စေရန် ပြင်ထားပါသည်)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'myTurn') {
            // ကိုယ့်အလှည့်ရောက်သံ - "တီတီလင်း... တီတီလင်း" (ကျယ်ပြီး အသံရှည်သည်)
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc1.type = 'sine'; osc1.frequency.setValueAtTime(587.33, now); // D5
            osc2.type = 'sine'; osc2.frequency.setValueAtTime(880.00, now); // A5
            
            gain.gain.setValueAtTime(0.0, now);
            gain.gain.linearRampToValueAtTime(0.8, now + 0.05);
            gain.gain.setValueAtTime(0.8, now + 0.15);
            gain.gain.linearRampToValueAtTime(0.0, now + 0.25);
            
            gain.gain.linearRampToValueAtTime(0.8, now + 0.35);
            gain.gain.setValueAtTime(0.8, now + 0.45);
            gain.gain.linearRampToValueAtTime(0.0, now + 0.60);
            
            osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
            osc1.start(now); osc1.stop(now + 0.60);
            osc2.start(now); osc2.stop(now + 0.60);
        } else if (type === 'move' || type === 'jump') {
            // တစ်ဖက်လူရွှေ့သံ သို့မဟုတ် ကျားစားသံ - "ဒေါက်" (ကျယ်ကျယ်နှင့် ပြတ်ပြတ်)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
            gain.gain.setValueAtTime(1.0, now); // အမြင့်ဆုံးအသံအကျယ်
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'tick') {
            // အချိန်ကုန်ခါနီး သတိပေးသံ - "ဘစ်... ဘစ်" (ခပ်စူးစူး)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.05);
        }
    }

    const boardElement = document.getElementById('gameBoard');
    const statusText = document.getElementById('statusText');
    const lobbyPanel = document.getElementById('lobbyPanel');
    const restartBtn = document.getElementById('restartBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    
    let boardState = [];
    let turn = 'R'; 
    let selectedPiece = null;
    let validMoves = [];
    let forceJumpsAvailable = [];
    let isMultiJumping = false; 
    let maximumPossibleJumps = 0;

    let roomId = null;
    let myColor = null; 
    
    let timerInterval = null;
    let localSecondsLeft = 15;
    let lastTurnServerTime = 0;
    let oldTurnState = ''; // အလှည့်ပြောင်းလဲမှုကို စောင့်ကြည့်ရန်

    function hostRoom() {
        roomId = Math.floor(1000 + Math.random() * 9000); 
        myColor = 'R'; 
        lobbyPanel.innerHTML = `<h3 style="margin:5px 0;">🏠 Room ID: <span style="color:#f1c40f;">${roomId}</span></h3> <span style="font-size:12px;color:#bdc3c7;">(တစ်ဖက်လူကို ဒီ ID ပေးပြီး ဝင်ခိုင်းလိုက်ပါ)</span>`;
        
        initBoardStateOnly();
        database.ref(`rooms/${roomId}`).set({
            boardState: JSON.stringify(boardState),
            turn: 'R',
            status: 'waiting',
            restartRequested: false,
            lastTurnTime: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            listenToRoom();
        }).catch(err => {
            alert("Room ဆောက်မရပါ။ VPN ပြန်စစ်ပေးပါဦးဗျာ။");
        });
    }

    function joinRoom() {
        const inputId = document.getElementById('roomInput').value.trim();
        if(!inputId) { alert("Room ID ထည့်ပါဦးဗျာ။"); return; }
        roomId = inputId;
        myColor = 'B'; 

        database.ref(`rooms/${roomId}`).once('value').then((snapshot) => {
            if(snapshot.exists()) {
                database.ref(`rooms/${roomId}`).update({ 
                    status: 'playing',
                    lastTurnTime: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    lobbyPanel.style.display = 'none';
                    restartBtn.style.display = 'inline-block';
                    listenToRoom();
                });
            } else {
                alert("Room မရှိပါ သို့မဟုတ် ID မှားနေပါတယ်ဗျာ။");
            }
        }).catch(err => {
            alert("ချိတ်ဆက်မှု အဆင်မပြေပါ။");
        });
    }

    function listenToRoom() {
        database.ref(`rooms/${roomId}`).on('value', (snapshot) => {
            const data = snapshot.val();
            if(!data) return;

            boardState = JSON.parse(data.boardState);
            const serverTurn = data.turn;
            lastTurnServerTime = data.lastTurnTime || Date.now();
            
            // ကိုယ့်အလှည့်အသစ်ရောက်လာလျှင် ကျယ်ကျယ်လောင်လောင် မြည်စေရန် စစ်ဆေးခြင်း
            if (serverTurn !== oldTurnState) {
                turn = serverTurn;
                oldTurnState = serverTurn;
                if (turn === myColor && data.status === 'playing') {
                    playSound('myTurn'); 
                } else if (data.status === 'playing') {
                    playSound('move'); 
                }
            }

            turn = serverTurn;

            if(data.status === 'waiting') {
                statusText.innerText = "⏳ ကစားဖော်ကို စောင့်ဆိုင်းနေပါသည်...";
                timerDisplay.style.display = 'none';
            } else {
                lobbyPanel.style.display = 'none';
                restartBtn.style.display = 'inline-block';
                timerDisplay.style.display = 'inline-block';
                updateStatusText();
                startLocalTimer();
            }

            if(data.restartRequested === true) {
                alert("တစ်ဖက်လူက ပွဲသစ်ပြန်စလိုက်ပါပြီ။");
                database.ref(`rooms/${roomId}`).update({ restartRequested: false });
            }

            forceJumpsAvailable = [];
            maximumPossibleJumps = 0;
            if (!isMultiJumping) {
                checkForForceJumps();
            }
            renderBoard();
            checkGameOver();
        });
    }

    function startLocalTimer() {
        clearInterval(timerInterval);
        database.ref('.info/serverTimeOffset').once('value').then((offsetSnap) => {
            const offset = offsetSnap.val() || 0;
            
            timerInterval = setInterval(() => {
                const currentServerTime = Date.now() + offset;
                const timePassedSeconds = Math.floor((currentServerTime - lastTurnServerTime) / 1000);
                localSecondsLeft = 15 - timePassedSeconds;

                if (localSecondsLeft <= 0) {
                    localSecondsLeft = 0;
                    clearInterval(timerInterval);
                    handleTimeOut();
                }

                timerDisplay.innerText = `⏱ ကျန်ရှိချိန် - ${localSecondsLeft} စက္ကန့်`;
                if (localSecondsLeft <= 5) {
                    timerDisplay.classList.add('timer-urgent');
                    if(localSecondsLeft > 0) playSound('tick');
                } else {
                    timerDisplay.classList.remove('timer-urgent');
                }
            }, 1000);
        });
    }

    // 🤖 အချိန်ကုန်လျှင် အလိုအလျောက် ရွှေ့ပေးမည့်စနစ် (Auto-Move Engine)
    function handleTimeOut() {
        if (myColor !== turn) return; // မိမိအလှည့်ဖြစ်မှသာ မိမိဖုန်းကနေ ရွှေ့မည်။

        let finalMove = null;
        let fromPiece = null;

        // အကယ်၍ မဖြစ်မနေ စားရမယ့် အကွက်ရှိနေလျှင်
        if (forceJumpsAvailable.length > 0) {
            const luckyChoice = forceJumpsAvailable[Math.floor(Math.random() * forceJumpsAvailable.length)];
            fromPiece = { row: luckyChoice.row, col: luckyChoice.col };
            finalMove = luckyChoice.jumps[Math.floor(Math.random() * luckyChoice.jumps.length)];
        } else {
            // ရိုးရိုးရွှေ့ကွက်များထဲမှ ရှာခြင်း
            let allNormalMoves = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (boardState[r][c] && boardState[r][c].startsWith(turn)) {
                        let nMoves = getPieceNormalMoves(r, c);
                        nMoves.forEach(m => {
                            allNormalMoves.push({ from: {row: r, col: c}, move: m });
                        });
                    }
                }
            }
            if (allNormalMoves.length > 0) {
                let choice = allNormalMoves[Math.floor(Math.random() * allNormalMoves.length)];
                fromPiece = choice.from;
                finalMove = choice.move;
            }
        }

        // ရွှေ့ကွက်တွေ့လျှင် အလိုအလျောက် ရွှေ့ပြီး Firebase သို့ တင်မည်
        if (finalMove && fromPiece) {
            let pieceType = boardState[fromPiece.row][fromPiece.col];
            boardState[finalMove.toRow][finalMove.toCol] = pieceType;
            boardState[fromPiece.row][fromPiece.col] = null;
            
            let action = 'move';
            if (finalMove.type === 'jump') {
                boardState[finalMove.eatR][finalMove.eatCol] = null;
                action = 'jump';
            }

            if (turn === 'R' && finalMove.toRow === 0 && pieceType === 'R') boardState[finalMove.toRow][finalMove.toCol] = 'RK';
            if (turn === 'B' && finalMove.toRow === 7 && pieceType === 'B') boardState[finalMove.toRow][finalMove.toCol] = 'BK';

            isMultiJumping = false;
            turn = (turn === 'R') ? 'B' : 'R';
            selectedPiece = null;
            validMoves = [];

            syncDataToFirebase(action);
        } else {
            // လုံးဝရွှေ့ကွက်မရှိတော့လျှင် အလှည့်ကို ဒီတိုင်း ပြောင်းပေးလိုက်မည်
            turn = (turn === 'R') ? 'B' : 'R';
            selectedPiece = null;
            validMoves = [];
            isMultiJumping = false;
            syncDataToFirebase('move');
        }
    }

    function syncDataToFirebase(actionType) {
        if(!roomId) return;
        database.ref(`rooms/${roomId}`).update({
            boardState: JSON.stringify(boardState),
            turn: turn,
            lastTurnTime: firebase.database.ServerValue.TIMESTAMP
        });
    }

    function resetOnlineGame() {
        if(!roomId) return;
        initBoardStateOnly();
        database.ref(`rooms/${roomId}`).update({
            boardState: JSON.stringify(boardState),
            turn: 'R',
            restartRequested: true,
            lastTurnTime: firebase.database.ServerValue.TIMESTAMP
        });
    }

    function initBoardStateOnly() {
        boardState = Array(8).fill(null).map(() => Array(8).fill(null));
        for (let r = 0; r < 3; r++) { for (let c = 0; c < 8; c++) { if ((r + c) % 2 === 0) boardState[r][c] = 'B'; } }
        for (let r = 5; r < 8; r++) { for (let c = 0; c < 8; c++) { if ((r + c) % 2 === 0) boardState[r][c] = 'R'; } }
    }

    function checkForForceJumps() {
        forceJumpsAvailable = [];
        maximumPossibleJumps = 0;
        if (isMultiJumping) return; 

        let allJumpsFound = [];
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = boardState[r][c];
                if (piece && piece.startsWith(turn)) {
                    const jumps = getPieceJumpsOnly(r, c);
                    if (jumps.length > 0) {
                        jumps.forEach(j => {
                            let depth = simulateMaxJumps(r, c, j.toRow, j.toCol, j.eatR, j.eatCol);
                            if (depth > maximumPossibleJumps) maximumPossibleJumps = depth;
                            allJumpsFound.push({ row: r, col: c, jumpMove: j, maxDepth: depth });
                        });
                    }
                }
            }
        }
        if (allJumpsFound.length > 0) {
            allJumpsFound.forEach(item => {
                if (item.maxDepth === maximumPossibleJumps) {
                    let existing = forceJumpsAvailable.find(f => f.row === item.row && f.col === item.col);
                    if (existing) existing.jumps.push(item.jumpMove);
                    else forceJumpsAvailable.push({ row: item.row, col: item.col, jumps: [item.jumpMove] });
                }
            });
        }
    }

    function simulateMaxJumps(startR, startC, toR, toC, eatR, eatCol) {
        let originalPiece = boardState[startR][startC];
        let targetPiece = boardState[eatR][eatCol];
        boardState[startR][startC] = null;
        boardState[eatR][eatCol] = null;
        let isKing = originalPiece.endsWith('K');
        let simulatedPiece = originalPiece;
        if (!isKing && turn === 'R' && toR === 0) simulatedPiece = 'RK';
        if (!isKing && turn === 'B' && toR === 7) simulatedPiece = 'BK';
        boardState[toR][toC] = simulatedPiece;
        let nextJumps = [];
        if (!(simulatedPiece !== originalPiece && !isKing)) nextJumps = getPieceJumpsOnly(toR, toC);
        let maxSubJumps = 0;
        if (nextJumps.length > 0) {
            nextJumps.forEach(nj => {
                let subDepth = simulateMaxJumps(toR, toC, nj.toRow, nj.toCol, nj.eatR, nj.eatCol);
                if (subDepth > maxSubJumps) maxSubJumps = subDepth; // ပြင်ဆင်ပြီးသား ကွက်တိမှန်ကန်သောလိုင်း
            });
        }
        boardState[toR][toC] = null;
        boardState[startR][startC] = originalPiece;
        boardState[eatR][eatCol] = targetPiece;
        return 1 + maxSubJumps;
    }

    function getPieceJumpsOnly(row, col) {
        const piece = boardState[row][col];
        if(!piece) return [];
        const isKing = piece.endsWith('K');
        const jumps = [];
        const dirs = [{r:-1, c:-1}, {r:-1, c:1}, {r:1, c:-1}, {r:1, c:1}];

        if (isKing) {
            dirs.forEach(dir => {
                let currR = row + dir.r; let currC = col + dir.c;
                let enemy = null;
                while (currR >= 0 && currR < 8 && currC >= 0 && currC < 8) {
                    const p = boardState[currR][currC];
                    if (!enemy) { if (p !== null) { if (!p.startsWith(turn)) enemy = { r: currR, c: currC }; else break; } }
                    else { if (p === null) jumps.push({ toRow: currR, toCol: currC, type: 'jump', eatR: enemy.r, eatCol: enemy.c }); else break; }
                    currR += dir.r; currC += dir.c;
                }
            });
        } else {
            const allowedDirs = (turn === 'R') ? [{r:-1, c:-1}, {r:-1, c:1}] : [{r:1, c:-1}, {r:1, c:1}];
            allowedDirs.forEach(dir => {
                const eR = row + dir.r; const eC = col + dir.c;
                const jR = row + (dir.r * 2); const jC = col + (dir.c * 2);
                if (jR >= 0 && jR < 8 && jC >= 0 && jC < 8) {
                    const enemy = boardState[eR][eC];
                    const target = boardState[jR][jC];
                    if (enemy && !enemy.startsWith(turn) && target === null) jumps.push({ toRow: jR, toCol: jC, type: 'jump', eatR: eR, eatCol: eC });
                }
            });
        }
        return jumps;
    }

    function renderBoard() {
        boardElement.innerHTML = '';
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                square.className = `square ${(r + c) % 2 === 0 ? 'dark' : 'light'}`;
                if (validMoves.some(m => m.toRow === r && m.toCol === c)) square.classList.add('suggested');
                const pieceType = boardState[r][c];
                if (pieceType) {
                    const piece = document.createElement('div');
                    piece.className = `piece ${pieceType.startsWith('R') ? 'red-piece' : 'black-piece'}`;
                    if (pieceType.endsWith('K')) piece.innerHTML = '👑';
                    if (selectedPiece && selectedPiece.row === r && selectedPiece.col === c) piece.classList.add('selected');
                    piece.onclick = (e) => { e.stopPropagation(); handlePieceClick(r, c); };
                    square.appendChild(piece);
                }
                square.onclick = () => handleSquareClick(r, c);
                boardElement.appendChild(square);
            }
        }
    }

    function handlePieceClick(row, col) {
        if (!roomId || myColor !== turn) return; 
        if (isMultiJumping) return; 
        if (!boardState[row][col].startsWith(turn)) return;
        
        if (forceJumpsAvailable.length > 0) {
            const found = forceJumpsAvailable.find(f => f.row === row && f.col === col);
            if (!found) { alert(`⚠️ စားနိုင်သောအကွက်ကို မဖြစ်မနေရွေးရမည်!`); return; }
            validMoves = found.jumps;
        } else { validMoves = getPieceNormalMoves(row, col); }
        selectedPiece = { row, col };
        renderBoard();
    }

    function getPieceNormalMoves(row, col) {
        const piece = boardState[row][col];
        if (!piece) return [];
        const isKing = piece.endsWith('K');
        const moves = [];
        const dirs = [{r:-1, c:-1}, {r:-1, c:1}, {r:1, c:-1}, {r:1, c:1}];
        if (isKing) {
            dirs.forEach(dir => {
                let currR = row + dir.r; let currC = col + dir.c;
                while (currR >= 0 && currR < 8 && currC >= 0 && currC < 8) {
                    if (boardState[currR][currC] === null) moves.push({ toRow: currR, toCol: currC, type: 'move' }); else break;
                    currR += dir.r; currC += dir.c;
                }
            });
        } else {
            const allowedDirs = (turn === 'R') ? [{r:-1, c:-1}, {r:-1, c:1}] : [{r:1, c:-1}, {r:1, c:1}];
            allowedDirs.forEach(dir => {
                const nR = row + dir.r; const nC = col + dir.c;
                if (nR >= 0 && nR < 8 && nC >= 0 && nC < 8 && boardState[nR][nC] === null) moves.push({ toRow: nR, toCol: nC, type: 'move' });
            });
        }
        return moves;
    }

    function handleSquareClick(row, col) {
        if (!roomId || myColor !== turn) return; 
        if (!selectedPiece) return;
        const move = validMoves.find(m => m.toRow === row && m.toCol === col);
        if (move) {
            let pieceType = boardState[selectedPiece.row][selectedPiece.col];
            boardState[row][col] = pieceType;
            boardState[selectedPiece.row][selectedPiece.col] = null;
            
            let currentAction = 'move';

            if (move.type === 'jump') {
                boardState[move.eatR][move.eatCol] = null;
                currentAction = 'jump';

                if (turn === 'R' && row === 0 && pieceType === 'R') { boardState[row][col] = 'RK'; pieceType = 'RK'; }
                if (turn === 'B' && row === 7 && pieceType === 'B') { boardState[row][col] = 'BK'; pieceType = 'BK'; }
                const nextJumps = getPieceJumpsOnly(row, col);
                if (nextJumps.length > 0) { 
                    isMultiJumping = true; 
                    selectedPiece = { row, col }; 
                    validMoves = nextJumps; 
                    renderBoard(); 
                    syncDataToFirebase('jump'); 
                    return; 
                }
            }
            if (turn === 'R' && row === 0 && pieceType === 'R') boardState[row][col] = 'RK';
            if (turn === 'B' && row === 7 && pieceType === 'B') boardState[row][col] = 'BK';
            isMultiJumping = false; 
            turn = (turn === 'R') ? 'B' : 'R'; 
            selectedPiece = null; 
            validMoves = [];
            
            updateStatusText(); 
            syncDataToFirebase(currentAction); 
        } else { if (!isMultiJumping) { selectedPiece = null; validMoves = []; } }
        renderBoard();
    }

    function updateStatusText() { 
        let text = (turn === 'R' ? "🔴 အနီရောင်" : "⚫ အနက်ရောင်") + " အလှည့်";
        if(myColor === turn) { text += " (သင့်အလှည့်)"; } else { text += " (တစ်ဖက်လူအလှည့်)"; }
        statusText.innerText = text; 
    }
    
    function checkGameOver() {
        let rCount = 0, bCount = 0;
        for (let r = 0; r < 8; r++) { for (let c = 0; c < 8; c++) { if (boardState[r][c]?.startsWith('R')) rCount++; if (boardState[r][c]?.startsWith('B')) bCount++; } }
        if (rCount === 0 && bCount > 0) { clearInterval(timerInterval); alert("🎉 ပွဲပြီးပါပြီ။ အနက်ရောင် အနိုင်ရရှိပါသည်။"); }
        else if (bCount === 0 && rCount > 0) { clearInterval(timerInterval); alert("🎉 ပွဲပြီးပါပြီ။ အနီရောင် အနိုင်ရရှိပါသည်။"); }
    }

    initBoardStateOnly();
    renderBoard();
</script>
</body>
</html>
